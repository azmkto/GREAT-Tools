[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "great"
version = "0.1.0"
description = "Shared utilities for azmkto's social-media research notebooks"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy",
]

[project.optional-dependencies]
ml = ["scikit-learn"]
text = ["ftfy", "nltk", "PySastrawi"]
# great.viz imports every one of these at import time, so `from great.viz import ...`
# never needs the notebook to install or import a plotting library itself. That includes
# scikit-learn: great/viz/wordcloud.py imports TfidfVectorizer at module level and
# great/viz/__init__.py imports that module, so `[viz]` without `great[ml]` would make
# even `from great.viz import prep` raise ModuleNotFoundError.
viz = ["matplotlib", "scienceplots", "wordcloud", "seaborn", "plotly", "great[ml]"]
# Everything. Written as a reference to the other extras so it can't drift out of sync
# when one of them gains a dependency.
all = ["great[ml,text,viz]"]

[tool.setuptools]
packages = ["great", "great.viz"]
