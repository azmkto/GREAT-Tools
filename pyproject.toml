[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riset"
version = "0.1.0"
description = "Shared utilities for azmkto's social-media research notebooks"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy",
]

[project.optional-dependencies]
text = ["ftfy", "nltk", "PySastrawi"]

[tool.setuptools]
packages = ["riset"]
